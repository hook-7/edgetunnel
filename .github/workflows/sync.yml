name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Sync upstream changes
        run: |
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main

          # Preserve this fork's workflow files. GITHUB_TOKEN cannot update them,
          # and sync configuration should only change here by deliberate review.
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork main already contains upstream main."
            exit 0
          fi

          # Merge upstream without rewriting fork history. If upstream changes
          # workflow files, restore the fork's versions before pushing.
          if git merge --no-ff --no-edit upstream/main; then
            git restore --source=HEAD^1 --staged --worktree -- .github/workflows/
            git clean -fd -- .github/workflows/
            git add -A
            git commit --amend --no-edit
          else
            git restore --source=HEAD --staged --worktree -- .github/workflows/
            git clean -fd -- .github/workflows/
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "[Error] Upstream sync has conflicts outside .github/workflows/. Resolve them manually."
              exit 1
            fi
            git add -A
            git commit -m "Merge upstream main (preserve fork workflows)"
          fi

          # A normal push is intentional: fail safely if main moved concurrently.
          git push origin HEAD:main
